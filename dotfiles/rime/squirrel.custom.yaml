patch:
  keyboard_layout: default
  show_notifications_when: appropriate

  style:
    color_scheme: native
    color_scheme_dark: native
    candidate_list_layout: stacked
    text_orientation: horizontal
    inline_preedit: true
    corner_radius: 6
    hilited_corner_radius: 4
    border_height: -1
    border_width: -1
    line_spacing: 5
    font_face: ""
    font_point: 15
    label_font_point: 13
    comment_font_point: 13

  app_options:
    com.mitchellh.ghostty:
      ascii_mode: true
      vim_mode: true
    com.superlogical.rex:
      ascii_mode: true
      vim_mode: true
    com.googlecode.iterm2:
      ascii_mode: true
      vim_mode: true
    dev.zed.Zed:
      ascii_mode: true
      vim_mode: true
    com.vscodium:
      ascii_mode: true
      vim_mode: true
    com.raycast.macos:
      ascii_mode: true
    info.sioyek.sioyek:
      ascii_mode: true
    com.colliderli.iina:
      ascii_mode: true
